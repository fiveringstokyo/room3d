const texLoader=new THREE.TextureLoader(); const texCache={};
function texOf(k){ if(!texCache[k]){ const t=texLoader.load('tex/'+k+'.jpg'); t.colorSpace=THREE.SRGBColorSpace; texCache[k]=t; } return texCache[k]; }
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x1e2430);
const cam=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,1,10000);
cam.position.set(1100,1000,700);
const ren=new THREE.WebGLRenderer({antialias:true}); ren.setSize(innerWidth,innerHeight); document.body.appendChild(ren.domElement);
const ctl=new OrbitControls(cam,ren.domElement); ctl.target.set(368,0,-306);

const byIdx={};   // idx -> {meshes:[...], edges:[...]}
function mk(o,zmax,grp){const [x0,y0,z0,x1,y1,z1r]=o.b; const z1=Math.min(z1r,zmax); if(z1<=z0) return; const c=COLORS[o.m];

for(const o of BOXES){ mk(o,99999,full); mk(o,(o.m==='wall'||o.m==='glass'||o.b[5]>=200)?120:99999,low); }

// ── 選ぶ・消す
let picking=false, selected=null; const deleted=[];
const KEY='room3d_deleted';
function label(i){const o=BOXES[i]; const [x0,y0,z0,x1,y1,z1]=o.b; return `#${i} ${o.n} (${x0},${y0})-(${x1},${y1}) 高さ${z0}-${z1}`;}
function setHi(i,on){ if(i==null) return; for(const m of byIdx[i].meshes){ m.material.emissive=new THREE.Color(on?0xcc8800:0x000000); } }
function select(i){ setHi(selected,false); selected=i; setHi(i,true); $('sel').textContent=i==null?'':'選択中: '+label(i); $('del').disabled=(i==null); }
function setVisible(i,v){ for(const m of byIdx[i].meshes) m.visible=v; for(const e of byIdx[i].edges) e.visible=v; }
function refresh(){ $('undo').disabled=$('reset').disabled=$('copy').disabled=(deleted.length===0);
 $('log').textContent=deleted.length?('消した物 '+deleted.length+'個:\n'+deleted.map(label).join('\n')):'';
 localStorage.setItem(KEY,JSON.stringify(deleted)); }
$('pick').onclick=()=>{picking=!picking; $('pick').classList.toggle('on',picking); $('pick').textContent=picking?'選ぶモード中（押して解除）':'選ぶモード'; if(!picking) select(null);};
$('del').onclick=()=>{ if(selected==null) return; setVisible(selected,false); deleted.push(selected); select(null); refresh(); };
$('undo').onclick=()=>{ const i=deleted.pop(); if(i!=null) setVisible(i,true); refresh(); };
$('reset').onclick=()=>{ while(deleted.length){ setVisible(deleted.pop(),true);} refresh(); };
$('copy').onclick=async()=>{ const t='【3D】消した物:\n'+deleted.map(label).join('\n'); try{ await navigator.clipboard.writeText(t); $('sel').textContent='コピーした。班の会話に貼って'; }catch(e){ prompt('ここをコピー', t); } };
// 前回消した物を復元
try{ const saved=JSON.parse(localStorage.getItem(KEY)||'[]'); for(const i of saved){ if(byIdx[i]){ setVisible(i,false); deleted.push(i);} } refresh(); }catch(e){}
// タップで選ぶ（ドラッグと区別）
const ray=new THREE.Raycaster(), ptr=new THREE.Vector2(); let down=null;
ren.domElement.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY,t:Date.now()};});
ren.domElement.addEventListener('pointerup',e=>{ if(!picking||!down) return; const dx=e.clientX-down.x, dy=e.clientY-down.y; if(dx*dx+dy*dy>64||Date.now()-down.t>600) return;

 if(hits.length){ select(hits[0].object.userData.idx); } else select(null); });
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight)});
(function loop(){requestAnimationFrame(loop);ctl.update();ren.render(scene,cam)})();
